[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not smoke and not ollama"'
markers = [
    "smoke: testa a inicialização local do Streamlit",
    "ollama: requer uma instância local do Ollama",
]

[tool.coverage.run]
source = ["core"]
branch = true

[tool.coverage.report]
show_missing = true
